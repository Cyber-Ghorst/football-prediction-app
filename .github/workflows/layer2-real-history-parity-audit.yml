name: Read-only Layer 2 real-history parity audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "layer2_real_history_parity_audit.py"
      - ".github/workflows/layer2-real-history-parity-audit.yml"

permissions:
  contents: write

concurrency:
  group: main-report-archive
  queue: max

jobs:
  audit:
    name: Compare canonical and Sportmonks Layer 2 profiles from CockroachDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate read-only database access configuration
        run: |
          test -n "$PROVIDER_DATABASE_URL" || { echo "::error::PROVIDER_DATABASE_URL secret is missing."; exit 1; }
          test -f root.crt || { echo "::error::CockroachDB root.crt is missing."; exit 1; }
      - name: Run real-history parity comparison
        run: |
          set -euo pipefail
          python layer2_real_history_parity_audit.py
          python -m json.tool reports/layer2_real_history_parity/latest.json >/dev/null
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp reports/layer2_real_history_parity/latest.json "reports/layer2_real_history_parity/${stamp}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/layer2_real_history_parity
          if ! git diff --cached --quiet; then
            git commit -m "Archive read-only Layer 2 real-history parity audit ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
