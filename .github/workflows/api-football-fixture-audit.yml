name: API-Football future fixture audit

on:
  push:
    branches: [main]
    paths:
      - "api_football.py"
      - "api_football_fixture_audit.py"
      - ".github/workflows/api-football-fixture-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

concurrency:
  group: api-football-future-fixture-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit upcoming API-Football fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APISPORTS_API_KEY: ${{ secrets.APISPORTS_API_KEY }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate API credential
        run: |
          test -n "$APISPORTS_API_KEY" || { echo "::error::APISPORTS_API_KEY secret is missing."; exit 1; }
      - name: Collect read-only future-fixture audit
        run: |
          set -euo pipefail
          mkdir -p reports/api_football_fixture_audit/archive
          python api_football_fixture_audit.py | tee /tmp/api-football-fixture-audit.json
          python -m json.tool reports/api_football_fixture_audit/latest.json >/dev/null
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp reports/api_football_fixture_audit/latest.json "reports/api_football_fixture_audit/archive/${stamp}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/api_football_fixture_audit
          if ! git diff --cached --quiet; then
            git commit -m "Archive API-Football future fixture audit ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
