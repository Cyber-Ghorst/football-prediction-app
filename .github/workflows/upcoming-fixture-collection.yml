name: Automatic upcoming fixture collection

on:
  push:
    branches: [main]
    paths:
      - "free_fixture_provider_refresh.py"
      - "free_fixture_crosswalk_audit.py"
      - "docs/LAYER11_SCHEDULED_FIXTURE_PROMOTION.md"
      - "docs/FUTURE_FIXTURE_PROVIDER_SEPARATION.md"
      - "test_free_fixture_auto_promotion.py"
      - "free_fixture_auto_promotion.py"
      - "provider_crosswalk_review_report.py"
      - "provider_entity_crosswalk.py"
      - "provider_data_storage.py"
      - "free_fixture_adapters.py"
      - "free_fixture_observation_pipeline.py"
      - "free_fixture_canonical_promotion.py"
      - "free_fixture_observation_store.py"
      - "upcoming_fixture_collector.py"
      - "temporary_fixture_store.py"
      - "free_fixture_window_coverage.py"
      - "test_free_fixture_window_coverage.py"
      - "provider_routing.py"
      - "football_repository.py"
      - ".github/workflows/upcoming-fixture-collection.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

# Keep fixture collection independent from other report-archive workflows.
# GitHub retains at most one pending run for this group; newer dispatches replace
# older pending dispatches instead of building an unbounded manual-run backlog.
concurrency:
  group: upcoming-fixture-collection

jobs:
  collect:
    name: Discover and persist upcoming fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
      FREE_FIXTURE_NONCOMMERCIAL_ACK_API_NINJAS: ${{ secrets.FREE_FIXTURE_NONCOMMERCIAL_ACK_API_NINJAS }}
      FREE_FIXTURE_TERMS_ACK_API_NINJAS: ${{ secrets.FREE_FIXTURE_TERMS_ACK_API_NINJAS }}
      FREE_FIXTURE_AUTO_PROMOTE_API_NINJAS: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_API_NINJAS }}
      FREE_FIXTURE_TERMS_ACK_HIGHLIGHTLY: ${{ secrets.FREE_FIXTURE_TERMS_ACK_HIGHLIGHTLY }}
      HIGHLIGHTLY_NON_BETTING_USE_CONFIRMED: ${{ secrets.HIGHLIGHTLY_NON_BETTING_USE_CONFIRMED }}
      FREE_FIXTURE_AUTO_PROMOTE_HIGHLIGHTLY: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_HIGHLIGHTLY }}
      FREE_FIXTURE_TERMS_ACK_BZZOIRO: ${{ secrets.FREE_FIXTURE_TERMS_ACK_BZZOIRO }}
      FREE_FIXTURE_AUTO_PROMOTE_BZZOIRO: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_BZZOIRO }}
      FREE_FIXTURE_TERMS_ACK_LIVESCORE: ${{ secrets.FREE_FIXTURE_TERMS_ACK_LIVESCORE }}
      FREE_FIXTURE_AUTO_PROMOTE_LIVESCORE: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_LIVESCORE }}
      FREE_FIXTURE_NONCOMMERCIAL_ACK_OPEN_MATCHDAY: ${{ secrets.FREE_FIXTURE_NONCOMMERCIAL_ACK_OPEN_MATCHDAY }}
      FREE_FIXTURE_TERMS_ACK_OPEN_MATCHDAY: ${{ secrets.FREE_FIXTURE_TERMS_ACK_OPEN_MATCHDAY }}
      FREE_FIXTURE_AUTO_PROMOTE_OPEN_MATCHDAY: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_OPEN_MATCHDAY }}
      FREE_FIXTURE_TERMS_ACK_OPENFOOTBALL: ${{ secrets.FREE_FIXTURE_TERMS_ACK_OPENFOOTBALL }}
      FREE_FIXTURE_AUTO_PROMOTE_OPENFOOTBALL: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_OPENFOOTBALL }}
      FREE_FIXTURE_TERMS_ACK_OPENLIGADB: ${{ secrets.FREE_FIXTURE_TERMS_ACK_OPENLIGADB }}
      FREE_FIXTURE_AUTO_PROMOTE_OPENLIGADB: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_OPENLIGADB }}
      FREE_FIXTURE_AUTO_PROMOTION_ENABLED: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTION_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$PROVIDER_DATABASE_URL" || { echo "::error::PROVIDER_DATABASE_URL secret is missing."; exit 1; }
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL (Neon) secret is missing."; exit 1; }
          test -f root.crt || { echo "::error::CockroachDB root.crt is missing."; exit 1; }

      - name: Refresh free-source fixture observations (staging only)
        continue-on-error: true
        env:
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports/free_fixture_provider_refresh/archive
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          python free_fixture_provider_refresh.py | tee "reports/free_fixture_provider_refresh/archive/${stamp}.json"
          python -m json.tool "reports/free_fixture_provider_refresh/archive/${stamp}.json" >/dev/null
          cp "reports/free_fixture_provider_refresh/archive/${stamp}.json" reports/free_fixture_provider_refresh/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/free_fixture_provider_refresh
          if ! git diff --cached --quiet; then
            git commit -m "Archive free fixture provider refresh report ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build and archive four-day cross-provider fixture coverage report
        continue-on-error: true
        env:
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          FREE_FIXTURE_WINDOW_DAYS: "4"
          FREE_FIXTURE_DAILY_TARGET: "20"
          FREE_FIXTURE_MIN_DAILY_TARGET: "10"
          FREE_FIXTURE_STRETCH_DAILY_TARGET: "30"
          FREE_FIXTURE_MAX_HIGHLIGHTS: "15"
          FREE_FIXTURE_WINDOW_MAX_AGE_HOURS: "24"
          FREE_FIXTURE_WINDOW_SNAPSHOT_LIMIT: "5"
        run: |
          set -euo pipefail
          mkdir -p reports/free_fixture_window_coverage/archive
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          python free_fixture_window_coverage.py | tee "reports/free_fixture_window_coverage/archive/${stamp}.json"
          python -m json.tool "reports/free_fixture_window_coverage/archive/${stamp}.json" >/dev/null
          cp "reports/free_fixture_window_coverage/archive/${stamp}.json" reports/free_fixture_window_coverage/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/free_fixture_window_coverage
          if ! git diff --cached --quiet; then
            git commit -m "Archive four-day provider fixture coverage report ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Promote explicitly approved fixtures into Neon app catalogue
        continue-on-error: true
        env:
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FREE_FIXTURE_AUTO_PROMOTION_ENABLED: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTION_ENABLED }}
          FREE_FIXTURE_AUTO_PROMOTE_OPENLIGADB: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_OPENLIGADB }}
          FREE_FIXTURE_TERMS_ACK_OPENLIGADB: ${{ secrets.FREE_FIXTURE_TERMS_ACK_OPENLIGADB }}
          FREE_FIXTURE_AUTO_PROMOTE_OPENFOOTBALL: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_OPENFOOTBALL }}
          FREE_FIXTURE_TERMS_ACK_OPENFOOTBALL: ${{ secrets.FREE_FIXTURE_TERMS_ACK_OPENFOOTBALL }}
          FREE_FIXTURE_AUTO_PROMOTE_OPEN_MATCHDAY: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_OPEN_MATCHDAY }}
          FREE_FIXTURE_TERMS_ACK_OPEN_MATCHDAY: ${{ secrets.FREE_FIXTURE_TERMS_ACK_OPEN_MATCHDAY }}
          FREE_FIXTURE_NONCOMMERCIAL_ACK_OPEN_MATCHDAY: ${{ secrets.FREE_FIXTURE_NONCOMMERCIAL_ACK_OPEN_MATCHDAY }}
          FREE_FIXTURE_AUTO_PROMOTE_LIVESCORE: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_LIVESCORE }}
          FREE_FIXTURE_TERMS_ACK_LIVESCORE: ${{ secrets.FREE_FIXTURE_TERMS_ACK_LIVESCORE }}
          FREE_FIXTURE_AUTO_PROMOTE_BZZOIRO: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_BZZOIRO }}
          FREE_FIXTURE_TERMS_ACK_BZZOIRO: ${{ secrets.FREE_FIXTURE_TERMS_ACK_BZZOIRO }}
          FREE_FIXTURE_AUTO_PROMOTE_HIGHLIGHTLY: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_HIGHLIGHTLY }}
          FREE_FIXTURE_TERMS_ACK_HIGHLIGHTLY: ${{ secrets.FREE_FIXTURE_TERMS_ACK_HIGHLIGHTLY }}
          FREE_FIXTURE_AUTO_PROMOTE_API_NINJAS: ${{ secrets.FREE_FIXTURE_AUTO_PROMOTE_API_NINJAS }}
          FREE_FIXTURE_TERMS_ACK_API_NINJAS: ${{ secrets.FREE_FIXTURE_TERMS_ACK_API_NINJAS }}
          FREE_FIXTURE_NONCOMMERCIAL_ACK_API_NINJAS: ${{ secrets.FREE_FIXTURE_NONCOMMERCIAL_ACK_API_NINJAS }}
        run: |
          set -euo pipefail
          mkdir -p reports/free_fixture_auto_promotion/archive
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          report="reports/free_fixture_auto_promotion/archive/${stamp}.json"
          python free_fixture_auto_promotion.py | tee "$report"
          python -m json.tool "$report" >/dev/null
          cp "$report" reports/free_fixture_auto_promotion/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/free_fixture_auto_promotion
          if ! git diff --cached --quiet; then
            git commit -m "Archive scheduled free fixture promotion report ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Generate and archive provider crosswalk progress report
        continue-on-error: true
        env:
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p reports/free_fixture_crosswalk_audit/archive
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          python free_fixture_crosswalk_audit.py
          python -m json.tool reports/free_fixture_crosswalk_audit/latest.json >/dev/null
          cp reports/free_fixture_crosswalk_audit/latest.json "reports/free_fixture_crosswalk_audit/archive/${stamp}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/free_fixture_crosswalk_audit
          if ! git diff --cached --quiet; then
            git commit -m "Archive free fixture crosswalk audit ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
