name: Read-only Sportmonks Bundesliga catalogue evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sportmonks-bundesliga-catalogue-audit.yml"

permissions:
  contents: write

concurrency:
  group: sportmonks-bundesliga-catalogue-evidence
  queue: max

jobs:
  audit:
    name: Verify authenticated Bundesliga season and roster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Run read-only account catalogue audit
        run: |
          set +e
          mkdir -p reports/provider_independent_catalogue/archive
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          python sportmonks_catalogue_access_audit.py > "reports/provider_independent_catalogue/archive/sportmonks_catalogue_access_${stamp}.json"
          audit_exit=$?
          set -e
          python -m json.tool "reports/provider_independent_catalogue/archive/sportmonks_catalogue_access_${stamp}.json" >/dev/null
          cp "reports/provider_independent_catalogue/archive/sportmonks_catalogue_access_${stamp}.json" reports/provider_independent_catalogue/sportmonks_catalogue_access_latest.json
          echo "AUDIT_EXIT=${audit_exit}" >> "$GITHUB_ENV"
      - name: Commit sanitized evidence report
        if: always()
        run: |
          if [ -f reports/provider_independent_catalogue/sportmonks_catalogue_access_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/provider_independent_catalogue/sportmonks_catalogue_access_latest.json reports/provider_independent_catalogue/archive
            if ! git diff --cached --quiet; then
              git commit -m "Archive read-only Sportmonks account catalogue evidence"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Require successful authenticated audit
        run: |
          test "${AUDIT_EXIT:-1}" = "0" || { echo "::error::Sportmonks account catalogue audit did not complete successfully."; exit 1; }
