name: Scheduled TipMaster benchmark refresh

on:
  workflow_dispatch:
  schedule:
    # 07:13 East Africa Time (UTC+3), every day.
    - cron: "13 4 * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-tipmaster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh TipMaster and verify Neon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install refresh dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31,<3.0" "psycopg[binary]>=3.2,<4.0"

      - name: Refresh benchmark and verify Neon round trip
        run: python tipmaster_refresh_job.py
