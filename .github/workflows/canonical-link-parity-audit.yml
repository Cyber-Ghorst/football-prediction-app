name: Read-only approved provider-link parity audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canonical_repository.py'
      - 'canonical_link_parity_audit.py'
      - '.github/workflows/canonical-link-parity-audit.yml'

permissions:
  contents: write

concurrency:
  group: canonical-link-parity-report
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate read-only audit configuration
        run: |
          test -n "$PROVIDER_DATABASE_URL" || { echo "::error::PROVIDER_DATABASE_URL secret is missing."; exit 1; }
          test -f root.crt || { echo "::error::CockroachDB root.crt is missing."; exit 1; }
      - name: Run provider-link parity audit
        run: |
          set -euo pipefail
          python canonical_link_parity_audit.py
          python -m json.tool reports/provider_independent_catalogue/approved_link_parity_latest.json >/dev/null
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp reports/provider_independent_catalogue/approved_link_parity_latest.json "reports/provider_independent_catalogue/approved_link_parity_${stamp}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/provider_independent_catalogue/approved_link_parity_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive provider-link parity audit ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
