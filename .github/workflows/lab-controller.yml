name: Prediction Lab Controller

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a safe controller operation"
        required: true
        type: choice
        options:
          - health_check
          - test_suite
        default: health_check
  push:
    branches:
      - "agent-trigger/**"
    paths:
      - ".agent/trigger.json"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  controller:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request == null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/agent run ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve safe operation
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              operation = os.environ.get("DISPATCH_OPERATION", "")
          elif os.environ["EVENT_NAME"] == "issue_comment":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              body = event.get("comment", {}).get("body", "").strip()
              prefix = "/agent run "
              operation = body[len(prefix):].strip() if body.startswith(prefix) else ""
          else:
              trigger = json.loads(Path(".agent/trigger.json").read_text(encoding="utf-8"))
              operation = trigger.get("operation", "")

          allowed = {"health_check", "test_suite"}
          if operation not in allowed:
              raise SystemExit("Rejected unsupported or missing operation")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"operation={operation}\n")
          print(f"Accepted operation: {operation}")

      - name: Check Streamlit deployment
        if: steps.operation.outputs.operation == 'health_check'
        env:
          APP_URL: https://football-prediction-app-evzek8cthsuavun8hanejj.streamlit.app/
          HEALTH_URL: https://football-prediction-app-evzek8cthsuavun8hanejj.streamlit.app/_stcore/health
        run: |
          set -o pipefail
          python - <<'PY' | tee controller-report.txt
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          url = os.environ["HEALTH_URL"]
          report = {
              "operation": "health_check",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "app_url": os.environ["APP_URL"],
              "probe_url": url,
              "probe_type": "streamlit_health_endpoint",
              "deployment_reachable": False,
              "application_status": "unknown",
              "health_endpoint_confirmed": False,
              "healthy": None,
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Prediction-Lab-Controller/1.1"},
          )

          try:
              with opener.open(request, timeout=25) as response:
                  body = response.read(512).decode("utf-8", errors="replace").strip()
                  report["http_status"] = response.status
                  report["response_body"] = body
                  report["deployment_reachable"] = True
                  if response.status == 200 and body.lower() == "ok":
                      report["application_status"] = "healthy"
                      report["health_endpoint_confirmed"] = True
                      report["healthy"] = True
                      report["result"] = "healthy"
                  else:
                      report["application_status"] = "unverified"
                      report["result"] = "reachable_but_health_unconfirmed"
                      report["note"] = "The endpoint responded, but did not return the expected HTTP 200 and body 'ok'."
          except urllib.error.HTTPError as exc:
              location = exc.headers.get("Location", "")
              report["http_status"] = exc.code
              report["redirect_location"] = location
              # An HTTP response proves that the host is reachable, even when
              # the response indicates authentication or an application error.
              report["deployment_reachable"] = True

              auth_redirect = (
                  exc.code in (301, 302, 303, 307, 308)
                  and "share.streamlit.io/-/auth/app" in location
              )
              if auth_redirect or exc.code in (401, 403):
                  report["application_status"] = "unverified"
                  report["result"] = "reachable_authentication_required"
                  report["note"] = (
                      "The deployment is reachable, but Streamlit authentication "
                      "prevents this unauthenticated probe from confirming app health."
                  )
              elif 500 <= exc.code <= 599:
                  report["application_status"] = "unhealthy"
                  report["healthy"] = False
                  report["result"] = "application_error"
                  report["error"] = f"HTTP {exc.code}"
              else:
                  report["application_status"] = "unverified"
                  report["result"] = "reachable_but_health_unconfirmed"
                  report["note"] = f"Unexpected HTTP response: {exc.code}"
          except Exception as exc:
              report["result"] = "probe_failed"
              report["error"] = f"{type(exc).__name__}: {exc}"

          print(json.dumps(report, indent=2))
          # Authentication-required is a successful reachability check, not
          # proof of application health. Fail only on network failure or 5xx.
          if not report["deployment_reachable"] or report["application_status"] == "unhealthy":
              sys.exit(1)
          PY

      - name: Install health-check dependencies
        if: steps.operation.outputs.operation == 'health_check'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application code smoke check
        if: steps.operation.outputs.operation == 'health_check'
        run: |
          set -o pipefail
          python deployment_smoke_check.py | tee deployment-smoke-report.json

      - name: Install test dependencies
        if: steps.operation.outputs.operation == 'test_suite'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        if: steps.operation.outputs.operation == 'test_suite'
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee controller-report.txt

      - name: Publish result to trigger issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          sections = [
              f"**Workflow result:** {os.environ.get('JOB_STATUS', 'unknown')}",
              f"**Operation:** {os.environ.get('OPERATION') or 'rejected / unresolved'}",
              f"**Run:** {os.environ['RUN_URL']}",
          ]
          for filename, heading in (("controller-report.txt", "Deployment probe / test output"), ("deployment-smoke-report.json", "Application smoke report")):
              path = Path(filename)
              if path.exists():
                  content = path.read_text(encoding="utf-8", errors="replace")
                  if len(content) > 7000:
                      content = content[:7000] + "\\n... output truncated"
                  sections.append(f"### {heading}\\n\\n{content}")
          body = "## Prediction Lab agent report\\n\\n" + "\\n\\n".join(sections)
          api = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments"
          request = Request(api, data=json.dumps({"body": body}).encode("utf-8"), headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }, method="POST")
          with urlopen(request, timeout=20) as response:
              print(f"Published agent report (HTTP {response.status})")
          PY

      - name: Upload controller report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-controller-report
          path: |
            controller-report.txt
            deployment-smoke-report.json
          if-no-files-found: warn
          retention-days: 14
