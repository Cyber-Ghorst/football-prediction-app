name: Prediction Lab Controller

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a safe controller operation"
        required: true
        type: choice
        options:
          - health_check
          - test_suite
          - full_check
          - prediction_run
          - result_sync
          - learning_audit
          - tipmaster_refresh_verify
          - openscores_connection_check
          - openscores_entity_mapping_audit
          - openscores_sportmonks_reconciliation
          - sportmonks_catalogue_access_audit
          - provider_league_catalogue_audit
        default: health_check
      season:
        description: "Season start year (Sportmonks current-season path: 2025+)"
        required: false
        type: string
        default: "2026"
      competition:
        description: "Exact competition name, or unique competition name"
        required: false
        type: string
      home_team:
        description: "Exact home team name"
        required: false
        type: string
      away_team:
        description: "Exact away team name"
        required: false
        type: string
  push:
    branches:
      - "agent-trigger/**"
    paths:
      - ".agent/trigger.json"
  issue_comment:
    types: [created]
  schedule:
    - cron: "13 */6 * * *"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: prediction-lab-controller
  cancel-in-progress: false

jobs:
  controller:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request == null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/agent run ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve safe operation
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_SEASON: ${{ inputs.season }}
          DISPATCH_COMPETITION: ${{ inputs.competition }}
          DISPATCH_HOME_TEAM: ${{ inputs.home_team }}
          DISPATCH_AWAY_TEAM: ${{ inputs.away_team }}
        run: |
          python - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          request = {}
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              operation = os.environ.get("DISPATCH_OPERATION", "")
              request = {
                  "season": os.environ.get("DISPATCH_SEASON", ""),
                  "competition": os.environ.get("DISPATCH_COMPETITION", ""),
                  "home_team": os.environ.get("DISPATCH_HOME_TEAM", ""),
                  "away_team": os.environ.get("DISPATCH_AWAY_TEAM", ""),
              }
          elif os.environ["EVENT_NAME"] == "schedule":
              operation = "health_check"
          elif os.environ["EVENT_NAME"] == "issue_comment":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              body = event.get("comment", {}).get("body", "").strip()
              prefix = "/agent run "
              tokens = shlex.split(body[len(prefix):]) if body.startswith(prefix) else []
              operation = tokens[0] if tokens else ""
              if operation == "prediction_run":
                  names = {"--season": "season", "--competition": "competition",
                           "--home": "home_team", "--away": "away_team"}
                  args = tokens[1:]
                  while args:
                      flag = args.pop(0)
                      if flag not in names or not args:
                          raise SystemExit("Prediction command accepts --season, --competition, --home and --away.")
                      request[names[flag]] = args.pop(0)
          else:
              trigger = json.loads(Path(".agent/trigger.json").read_text(encoding="utf-8"))
              operation = trigger.get("operation", "")

          allowed = {"health_check", "test_suite", "full_check", "prediction_run", "result_sync", "tipmaster_refresh_verify", "openscores_connection_check", "openscores_entity_mapping_audit", "openscores_sportmonks_reconciliation", "sportmonks_catalogue_access_audit", "provider_league_catalogue_audit", "learning_audit"}
          if operation not in allowed:
              raise SystemExit("Rejected unsupported or missing operation")
          if operation == "prediction_run":
              missing = [key for key in ("season", "competition", "home_team", "away_team") if not str(request.get(key, "")).strip()]
              if missing:
                  raise SystemExit("Prediction run requires season, competition, home team and away team: " + ", ".join(missing))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"operation={operation}\n")
              output.write("prediction_request=" + json.dumps(request, ensure_ascii=False) + "\n")
          print(f"Accepted operation: {operation}")
          PY

      - name: Detect and recover stale controller runs
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          base = f"https://api.github.com/repos/{repository}/actions/workflows/lab-controller.yml/runs"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url, method="GET"):
              request = Request(url, headers=headers, method=method)
              with urlopen(request, timeout=20) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else {}

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(minutes=45)
          recovered = []
          inspected = []
          for status in ("queued", "in_progress"):
              data = request_json(f"{base}?status={status}&per_page=100")
              for run in data.get("workflow_runs", []):
                  run_id = int(run.get("id", 0))
                  if not run_id or run_id == current_run:
                      continue
                  created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                  started_text = run.get("run_started_at")
                  reference_time = (
                      datetime.fromisoformat(started_text.replace("Z", "+00:00"))
                      if started_text else created
                  )
                  age_minutes = int((now - reference_time).total_seconds() // 60)
                  inspected.append({"run_id": run_id, "status": status, "age_minutes": age_minutes})
                  if reference_time < cutoff:
                      try:
                          request_json(f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel", "POST")
                          recovered.append({"run_id": run_id, "previous_status": status, "age_minutes": age_minutes, "action": "cancel_requested"})
                      except Exception as exc:
                          recovered.append({"run_id": run_id, "previous_status": status, "age_minutes": age_minutes, "action": "cancel_failed", "error_type": type(exc).__name__})

          report = {
              "checked_at_utc": now.isoformat(),
              "stale_threshold_minutes": 45,
              "workflow_scope": "Prediction Lab Controller only",
              "runs_inspected": inspected,
              "recovery_actions": recovered,
              "status": "stale_runs_recovered" if any(x["action"] == "cancel_requested" for x in recovered) else "no_stale_runs",
          }
          with open("watchdog-report.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Check Streamlit deployment
        if: steps.operation.outputs.operation == 'health_check' || steps.operation.outputs.operation == 'full_check'
        env:
          APP_URL: https://football-prediction-app-evzek8cthsuavun8hanejj.streamlit.app/
          HEALTH_URL: https://football-prediction-app-evzek8cthsuavun8hanejj.streamlit.app/_stcore/health
        run: |
          set -o pipefail
          exec > >(tee -a controller-report.txt) 2>&1
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from deployment_health_probe import classify_probe_response

          url = os.environ["HEALTH_URL"]
          report = {
              "operation": "health_check",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "app_url": os.environ["APP_URL"],
              "probe_url": url,
              "probe_type": "streamlit_health_endpoint",
              "deployment_reachable": False,
              "application_status": "unknown",
              "deployment_health": "unavailable",
              "health_endpoint_confirmed": False,
              "healthy": None,
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Prediction-Lab-Controller/1.1"},
          )

          try:
              with opener.open(request, timeout=25) as response:
                  body = response.read(512).decode("utf-8", errors="replace").strip()
                  report["http_status"] = response.status
                  report["response_body"] = body
                  report.update(classify_probe_response(response.status, body=body))
          except urllib.error.HTTPError as exc:
              location = exc.headers.get("Location", "")
              report["http_status"] = exc.code
              report["redirect_location"] = location
              report.update(
                  classify_probe_response(
                      exc.code,
                      redirect_location=location,
                  )
              )
          except Exception as exc:
              report["deployment_health"] = "unavailable"
              report["application_status"] = "unavailable"
              report["healthy"] = False
              report["result"] = "probe_failed"
              report["error"] = f"{type(exc).__name__}: {exc}"

          with open("deployment-health-report.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)
          print(json.dumps(report, indent=2))
          # A protected auth redirect proves reachability, not authenticated health.
          # Fail only when the deployment is unavailable or returns a server error.
          if report["deployment_health"] in ("unavailable", "degraded"):
              sys.exit(1)
          PY

      - name: Install health-check dependencies
        if: steps.operation.outputs.operation == 'health_check' || steps.operation.outputs.operation == 'full_check' || steps.operation.outputs.operation == 'result_sync' || steps.operation.outputs.operation == 'learning_audit' || steps.operation.outputs.operation == 'tipmaster_refresh_verify' || steps.operation.outputs.operation == 'openscores_connection_check' || steps.operation.outputs.operation == 'openscores_entity_mapping_audit' || steps.operation.outputs.operation == 'openscores_sportmonks_reconciliation'
        run: |
          exec > >(tee -a controller-report.txt) 2>&1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application code smoke check
        if: steps.operation.outputs.operation == 'health_check' || steps.operation.outputs.operation == 'full_check'
        run: |
          set -o pipefail
          exec > >(tee -a controller-report.txt) 2>&1
          python deployment_smoke_check.py | tee deployment-smoke-report.json

      - name: Run read-only live integration checks
        if: steps.operation.outputs.operation == 'health_check' || steps.operation.outputs.operation == 'full_check'
        env:
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          APISPORTS_API_KEY: ${{ secrets.APISPORTS_API_KEY }}
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        run: |
          set -o pipefail
          exec > >(tee -a controller-report.txt) 2>&1
          python integration_smoke_check.py | tee integration-smoke-report.json

      - name: Sync verified completed prediction results
        if: steps.operation.outputs.operation == 'result_sync' || github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
          LIVESCORE_FOOTBALL_BASE_URL: ${{ secrets.LIVESCORE_FOOTBALL_BASE_URL }}
        run: |
          set -o pipefail
          exec > >(tee -a controller-report.txt) 2>&1
          python sync_prediction_results.py --limit 10 | tee prediction-result-sync-report.json

      - name: Build leakage-safe learning readiness report
        if: steps.operation.outputs.operation == 'learning_audit' || github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p reports/learning_readiness/archive
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          LEARNING_READINESS_REPORT_PATH=learning-readiness-report.json python learning_readiness_audit.py
          python -m json.tool learning-readiness-report.json >/dev/null
          cp learning-readiness-report.json reports/learning_readiness/latest.json
          cp learning-readiness-report.json "reports/learning_readiness/archive/${stamp}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/learning_readiness
          if ! git diff --cached --quiet; then
            git commit -m "Archive learning readiness report ${stamp}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Install test dependencies
        if: always() && (steps.operation.outputs.operation == 'test_suite' || steps.operation.outputs.operation == 'full_check')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        if: always() && (steps.operation.outputs.operation == 'test_suite' || steps.operation.outputs.operation == 'full_check')
        run: |
          set -o pipefail
          exec > >(tee -a controller-report.txt) 2>&1
          python -m unittest discover -v

      - name: Install prediction-run dependencies
        if: steps.operation.outputs.operation == 'prediction_run'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare ephemeral Streamlit secrets
        if: steps.operation.outputs.operation == 'prediction_run'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_REPORT_TOKEN: ${{ secrets.GITHUB_REPORT_TOKEN || github.token }}
          APISPORTS_API_KEY: ${{ secrets.APISPORTS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
          LIVESCORE_FOOTBALL_BASE_URL: ${{ secrets.LIVESCORE_FOOTBALL_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          keys = (
              "SPORTMONKS_API_TOKEN", "SPORTMONKS_API_KEY", "PROVIDER_DATABASE_URL",
              "DATABASE_URL", "GITHUB_REPORT_TOKEN", "APISPORTS_API_KEY",
              "API_FOOTBALL_KEY", "HIGHLIGHTLY_API_KEY", "API_NINJAS_API_KEY",
              "LIVESCORE_FOOTBALL_BASE_URL",
          )
          target = Path(".streamlit")
          target.mkdir(exist_ok=True)
          lines = [f"{key} = {json.dumps(os.environ[key])}" for key in keys if os.environ.get(key)]
          (target / "secrets.toml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Ephemeral Streamlit secrets file prepared; values were not printed.")
          PY

      - name: Execute existing Streamlit prediction flow
        if: steps.operation.outputs.operation == 'prediction_run'
        env:
          PREDICTION_REQUEST: ${{ steps.operation.outputs.prediction_request }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_REPORT_TOKEN: ${{ secrets.GITHUB_REPORT_TOKEN || github.token }}
          APISPORTS_API_KEY: ${{ secrets.APISPORTS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
          LIVESCORE_FOOTBALL_BASE_URL: ${{ secrets.LIVESCORE_FOOTBALL_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from automated_prediction_run import main
          request = json.loads(os.environ["PREDICTION_REQUEST"])
          sys.argv = [
              "automated_prediction_run.py",
              "--season", str(request["season"]),
              "--competition", str(request["competition"]),
              "--home-team", str(request["home_team"]),
              "--away-team", str(request["away_team"]),
          ]
          raise SystemExit(main())
          PY

      - name: Run autonomous OpenScores connection check
        if: steps.operation.outputs.operation == 'openscores_connection_check'
        env:
          OPENSCORES_API_KEY: ${{ secrets.OPENSCORES_API_KEY }}
        run: |
          set -euo pipefail
          python openscores_connection_check.py

      - name: Install Sportmonks catalogue audit dependency
        if: steps.operation.outputs.operation == 'sportmonks_catalogue_access_audit'
        run: |
          set -euo pipefail
          python -m pip install requests

      - name: Audit Sportmonks account catalogue access (read-only)
        if: steps.operation.outputs.operation == 'sportmonks_catalogue_access_audit'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        run: |
          set -euo pipefail
          python sportmonks_catalogue_access_audit.py

      - name: Install provider catalogue audit dependency
        if: steps.operation.outputs.operation == 'provider_league_catalogue_audit'
        run: |
          set -euo pipefail
          python -m pip install requests

      - name: Audit Highlightly and LiveScoreFootball league catalogues (read-only)
        if: steps.operation.outputs.operation == 'provider_league_catalogue_audit'
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIVESCORE_FOOTBALL_BASE_URL: ${{ secrets.LIVESCORE_FOOTBALL_BASE_URL }}
        run: |
          set -euo pipefail
          python provider_league_catalogue_audit.py

      - name: Reconcile OpenScores against canonical Sportmonks history
        if: steps.operation.outputs.operation == 'openscores_sportmonks_reconciliation'
        env:
          OPENSCORES_API_KEY: ${{ secrets.OPENSCORES_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          python openscores_sportmonks_reconciliation.py

      - name: Audit OpenScores entity mapping candidates (read-only)
        if: steps.operation.outputs.operation == 'openscores_entity_mapping_audit'
        env:
          OPENSCORES_API_KEY: ${{ secrets.OPENSCORES_API_KEY }}
          PROVIDER_DATABASE_URL: ${{ secrets.PROVIDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          python openscores_entity_mapping_audit.py

      - name: Refresh TipMaster and verify Neon persistence
        if: steps.operation.outputs.operation == 'tipmaster_refresh_verify'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          from tipmaster_benchmark import fetch_tipmaster_consensus
          from tipmaster_storage import load_tipmaster_benchmark_records, save_tipmaster_benchmark_records

          report = {
              "operation": "tipmaster_refresh_verify",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "feed_status": "not_started",
              "neon_status": "not_started",
              "incoming_records": 0,
              "saved_records": 0,
              "reloaded_records": 0,
              "round_trip_verified": False,
              "prediction_ledger_touched": False,
          }
          database_url = os.environ.get("DATABASE_URL", "").strip()
          if not database_url:
              report.update({"neon_status": "not_configured", "result": "missing_DATABASE_URL_secret"})
              print(json.dumps(report, indent=2))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write("## TipMaster / Neon verification failed\n\nDATABASE_URL Actions secret is missing. No credentials were printed.\n")
              sys.exit(2)

          feed = fetch_tipmaster_consensus()
          records = feed.get("matches", [])
          report["feed_status"] = "connected"
          report["feed_counts"] = feed.get("counts", {})
          report["incoming_records"] = len(records)

          before = load_tipmaster_benchmark_records(database_url)
          report["neon_status"] = "connected"
          report["records_before"] = len(before)
          if not records:
              report.update({"reloaded_records": len(before), "result": "feed_returned_no_valid_records"})
              print(json.dumps(report, indent=2))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write("## TipMaster / Neon partially verified\n\nNeon connection and read succeeded, but the feed returned no valid records to round-trip.\n")
              sys.exit(1)

          saved = save_tipmaster_benchmark_records(database_url, records)
          after = load_tipmaster_benchmark_records(database_url)
          saved_ids = {row["source_match_id"] for row in records}
          reloaded_ids = {row["source_match_id"] for row in after}
          missing_ids = saved_ids - reloaded_ids
          report.update({
              "saved_records": saved,
              "reloaded_records": len(after),
              "round_trip_verified": not missing_ids,
              "missing_reloaded_ids_count": len(missing_ids),
              "result": "passed" if not missing_ids else "round_trip_mismatch",
          })
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## TipMaster / Neon persistence verification\n\n")
              out.write(f"- Feed: connected ({len(records)} valid records)\n")
              out.write(f"- Neon: connected; {len(before)} records before, {len(after)} after\n")
              out.write(f"- Records saved: {saved}\n")
              out.write(f"- Round-trip verified: {report['round_trip_verified']}\n")
              out.write("- Prediction ledger touched: no\n")
          if missing_ids:
              sys.exit(1)
          PY

      - name: Publish result to control issue
        if: always() && (github.event_name == 'issue_comment' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 54 }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          generated = datetime.now(timezone.utc)
          generated_utc = generated.isoformat(timespec="seconds")
          generated_eat = generated.astimezone(ZoneInfo("Africa/Nairobi")).isoformat(timespec="seconds")
          sections = [
              f"**Report generated (UTC):** {generated_utc}",
              f"**Report generated (Kenya / EAT):** {generated_eat}",
              f"**Workflow result:** {os.environ.get('JOB_STATUS', 'unknown')}",
              f"**Operation:** {os.environ.get('OPERATION') or 'rejected / unresolved'}",
              f"**Run:** {os.environ['RUN_URL']}",
          ]
          source_timestamps = []
          report_files = (
              ("watchdog-report.json", "Stalled-run watchdog"),
              ("deployment-health-report.json", "Deployment health classification"),
              ("controller-report.txt", "Deployment probe / test output"),
              ("deployment-smoke-report.json", "Application smoke report"),
              ("integration-smoke-report.json", "Live integration report"),
              ("openscores-connection-report.json", "OpenScores connection check"),
              ("openscores-entity-mapping-audit.json", "OpenScores entity mapping candidate audit"),
              ("openscores-sportmonks-reconciliation-report.json", "OpenScores to Sportmonks reconciliation"),
              ("sportmonks-catalogue-access-report.json", "Sportmonks account catalogue access audit"),
              ("provider-league-catalogue-audit.json", "Highlightly and LiveScoreFootball league catalogue audit"),
              ("prediction-run-report.json", "Automated prediction run report"),
              ("learning-readiness-report.json", "Leakage-safe learning readiness report"),
          )
          for filename, heading in report_files:
              path = Path(filename)
              if not path.exists():
                  continue
              content = path.read_text(encoding="utf-8", errors="replace")
              if filename.endswith(".json"):
                  try:
                      payload = json.loads(content)
                      def collect_times(value, key=""):
                          if isinstance(value, dict):
                              for child_key, child in value.items():
                                  if any(token in child_key.lower() for token in ("checked_at", "completed_at", "predicted_at", "started_at", "generated_at")):
                                      if isinstance(child, str):
                                          source_timestamps.append((child_key, child))
                                  collect_times(child, child_key)
                          elif isinstance(value, list):
                              for child in value:
                                  collect_times(child, key)
                      collect_times(payload)
                  except (json.JSONDecodeError, TypeError):
                      pass
              if "Ran " in content and " tests " in content:
                  summary = [
                      line for line in content.splitlines()
                      if re.search(r"Ran \d+ tests|^OK$|^FAILED|^FAIL:|^ERROR:|^Traceback", line)
                  ]
                  if summary:
                      content = "\n".join(summary[-30:])
              elif len(content) > 7000:
                  content = content[:7000] + "\n... output truncated"
              sections.append(f"### {heading}\n\n{content}")

          if source_timestamps:
              sections.insert(2, "**Underlying report timestamps:**\n" + "\n".join(
                  f"- {key}: {value}" for key, value in source_timestamps[-12:]
              ))
          body = (
              "<!-- prediction-lab-report -->\n"
              "## Prediction Lab — Most Recent Report\n\n"
              + "\n\n".join(sections)
          )
          Path("latest-controller-report.json").write_text(json.dumps({
              "report_generated_at_utc": generated_utc,
              "report_generated_at_eat": generated_eat,
              "workflow_result": os.environ.get("JOB_STATUS", "unknown"),
              "operation": os.environ.get("OPERATION") or "rejected / unresolved",
              "run_url": os.environ["RUN_URL"],
              "source_timestamps": [{"field": key, "value": value} for key, value in source_timestamps],
              "issue_report_body": body,
          }, indent=2), encoding="utf-8")
          api = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          # Keep one stable "latest report" comment. Older workflow/run history
          # remains available in GitHub Actions and the archived app reports.
          comments = []
          page = 1
          while True:
              list_request = Request(f"{api}?per_page=100&page={page}", headers=headers)
              with urlopen(list_request, timeout=20) as response:
                  batch = json.loads(response.read().decode("utf-8"))
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          latest_comments = [
              comment for comment in comments
              if "<!-- prediction-lab-report -->" in comment.get("body", "")
          ]
          payload = json.dumps({"body": body}).encode("utf-8")
          if latest_comments:
              latest_comment = max(latest_comments, key=lambda comment: comment["id"])
              target = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/comments/{latest_comment['id']}"
              method = "PATCH"
              action = f"Updated latest report comment #{latest_comment['id']}"
          else:
              target = api
              method = "POST"
              action = "Created latest report comment"
          publish_request = Request(target, data=payload, headers=headers, method=method)
          with urlopen(publish_request, timeout=20) as response:
              print(f"{action} (HTTP {response.status})")
          PY

      - name: Upload controller report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-controller-report
          path: |
            controller-report.txt
            deployment-health-report.json
            deployment-smoke-report.json
            integration-smoke-report.json
            openscores-connection-report.json
            openscores-entity-mapping-audit.json
            openscores-sportmonks-reconciliation-report.json
            sportmonks-catalogue-access-report.json
            provider-league-catalogue-audit.json
            prediction-run-report.json
            learning-readiness-report.json
            watchdog-report.json
            latest-controller-report.json
          if-no-files-found: warn
          retention-days: 14
